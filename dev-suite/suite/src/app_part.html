<script>
/* ================= DSL Registry seed ================= */
const LETTERS="אבגדהוזחטיכלמנסעפצקרשת".split(""), FINALS="ךםןףץ".split("");
const DSL_SEED=[
  {sym:"%",  name:"Inversion (alg-00%)", meaning:"Step down: invert to an underside, an __init__, or a §Canvas. Enables Presentiation, not limited to it."},
  {sym:"-%", name:"Lift (alg-00%⁻¹)",    meaning:"Step back up one level; the presence rises at the next letter."},
  {sym:"§",  name:"Presence (glove)",     meaning:"Infrastructural denotation of a presentiated occurring instance. Never a copy."},
  {sym:"Presentiation", name:"Presentiation", meaning:"A higher-order instance: the very presence of the occurring instance, like fingers on a hand."},
  {sym:"↑",  name:"Reach up",             meaning:"Read from the level above (e.g. the Matrix holding the Invariant)."},
  {sym:"↓",  name:"Reach down",           meaning:"Act on the level below."},
  {sym:"→",  name:"Yields / applies to",  meaning:"Left side produces or is applied to the right side."},
  {sym:"=T", name:"True",                 meaning:"A gate's condition holds."},
  {sym:"=F", name:"False",                meaning:"A gate's condition fails."},
  {sym:"needs:", name:"Logic line", meaning:"What a node requires before it can act."},
  {sym:"does:",  name:"Logic line", meaning:"What a node does."},
  {sym:"gives:", name:"Logic line", meaning:"What a node produces."},
  {sym:"ר",  name:"Resh — Echo", meaning:"001, the Governor, the core formula. Echo is the presentiated 001."},
  {sym:"alg-", name:"Algorithm id", meaning:"Prefix for registered algorithms, e.g. alg-003."}
];

/* ================= State ================= */
const STORE_KEY="echo-canvas-v3";
const ITEM_TYPES={
  node:{label:"Node",glyph:"○"}, matrix:{label:"Matrix",glyph:"▭"}, link:{label:"Link",glyph:"—"}, gate:{label:"Gate",glyph:"◇"},
  presence:{label:"§ Presence",glyph:"§"}, symbol:{label:"Symbol",glyph:"%"}, registry:{label:"Registry",glyph:"☰"}, note:{label:"Note",glyph:"✎"},
  file:{label:"Matrixed File",glyph:"⧈"}
};
const fresh=()=>({seq:0, dsl:DSL_SEED.map(e=>({...e,builtin:true})),
  canvases:{ top:{id:"top",name:"Notebook",parent:null,depth:0,view:{x:0,y:0,zoom:1},items:[],links:[]},
             under:{id:"under",name:"Underside",parent:"top",depth:1,view:{x:0,y:0,zoom:1},items:[],links:[]} },
  path:["top"]});
function load(){
  try{ const s=JSON.parse(localStorage.getItem(STORE_KEY)); if(s&&s.canvases) return s; }catch(e){}
  try{ // migrate v2 (nodes only)
    const o=JSON.parse(localStorage.getItem("echo-canvas-v2"));
    if(o&&o.canvases){ const s=fresh(); s.seq=o.seq||0; s.canvases={};
      for(const [id,c] of Object.entries(o.canvases)) s.canvases[id]={...c, name:id==="top"?"Notebook":c.name, items:(c.nodes||[]).map(n=>({...n,type:"node"})), links:[]};
      for(const c of Object.values(s.canvases)) delete c.nodes;
      s.path=["top"]; return s; }
  }catch(e){}
  return fresh();
}
/* ---- Dev Suite store: the suite's own workspace + Matrixed Files, each a full notebook ---- */
const DS_KEY="echo-devsuite-v1";
let DS=null;
try{ DS=JSON.parse(localStorage.getItem(DS_KEY)); }catch(e){}
if(!DS||!DS.suite){
  const echo=load(); echo.canvases.top.name="§Echo§"; echo.path=["top"];
  const suite=fresh(); suite.canvases.top.name="Dev Suite";
  suite.canvases.top.items.push({id:"w1",type:"file",file:"f1",name:"§Echo§",x:0,y:-1,w:12,h:9,side:"top",child:null});
  DS={suite, files:{f1:{name:"§Echo§", ws:echo}}, fseq:1, active:null};
}
let S=DS.active&&DS.files[DS.active]?DS.files[DS.active].ws:DS.suite;
/* ---- one-time seeds: DSL logic entries + the DSL Registry matrix on the underside ---- */
const LOGIC_SEED=[
  {sym:"|{If: (x=T/F), And (T/F)=(Y/N)}, {Then: (T=Y), And (F=N)}|", name:"Truth-to-answer rule", meaning:"If x is True or False, and True/False map to Yes/No, then True = Yes and False = No."},
  {sym:"If:",   name:"If",   meaning:"Condition: (x = T/F)."},
  {sym:"Then:", name:"Then", meaning:"Consequence of an If: (T = Y), (F = N)."},
  {sym:"And",   name:"And",  meaning:"Every joined condition must hold."},
  {sym:"Or",    name:"Or",   meaning:"Any one joined condition is enough."},
  {sym:"Not",   name:"Not",  meaning:"Negates: removes something from the operation."},
  {sym:"But",   name:"But",  meaning:"Keeps something in the whole while excusing it from the current operation. Not the same as Not.", pending:true},
  {sym:"Yes/But",        name:"Yes/But",        meaning:"Affirmed, with a held exception.", pending:true},
  {sym:"But/If",         name:"But/If",         meaning:"An exception that applies under a condition.", pending:true},
  {sym:"Yes/But Not If", name:"Yes/But Not If", meaning:"Affirmed, with an exception, unless a condition holds.", pending:true}
];
function ensureSeeds(){
  S.seeds=S.seeds||{};
  if(!S.seeds.logic1){ for(const e of LOGIC_SEED) if(!S.dsl.some(d=>d.sym===e.sym)) S.dsl.push({...e,builtin:false}); S.seeds.logic1=true; }
  if(!S.seeds.dslMatrix1 && S.canvases.under){
    S.canvases.under.items.push({id:"i"+(++S.seq),type:"matrix",name:"DSL Registry",x:0,y:-2,w:14,h:10,locked:false,child:null,presents:"dsl",state:"Rest"});
    S.seeds.dslMatrix1=true; }
}

let saveTimer=null;
/* ---- Undo / redo: snapshots of the active notebook's content (camera moves are not recorded) ---- */
const HIST={}, HMAX=20; let restoring=false;
const wsKey=()=>DS&&DS.active||"suite";
const snap=ws=>JSON.stringify(ws,(k,v)=>k==="view"||k==="path"?undefined:v);
function hist(){ const k=wsKey(); return HIST[k]=HIST[k]||{undo:[],redo:[],last:null}; }
function record(){ if(restoring||!S) return; const h=hist(), s=snap(S); if(h.last===null){ h.last=s; return; }
  if(s!==h.last){ h.undo.push(h.last); if(h.undo.length>HMAX) h.undo.shift(); h.redo.length=0; h.last=s; } refreshUndo(); }
function restoreTo(s){ const keepPath=S.path, views={}; for(const [id,c] of Object.entries(S.canvases)) views[id]=c.view;
  const ws=JSON.parse(s); for(const [id,c] of Object.entries(ws.canvases)) c.view=views[id]||{x:0,y:0,zoom:1};
  ws.path=keepPath.every(id=>ws.canvases[id])?keepPath:["top"];
  if(DS.active) DS.files[DS.active].ws=ws; else DS.suite=ws; S=ws; mode=null;
  restoring=true; closeMenu(); if(panel.classList.contains("open")) closePanel(); if(scrim.classList.contains("open")) closeBox(); restoring=false;
  readPal(); draw(); updateStatus(); refreshUndo(); restoring=true; try{ localStorage.setItem(DS_KEY,JSON.stringify(DS)); }catch(e){} restoring=false; }
function undo(){ const h=hist(); if(!h.undo.length) return; h.redo.push(h.last); h.last=h.undo.pop(); restoreTo(h.last); say("Undone",1200); }
function redo(){ const h=hist(); if(!h.redo.length) return; h.undo.push(h.last); h.last=h.redo.pop(); restoreTo(h.last); say("Redone",1200); }
function refreshUndo(){ const h=hist(), u=document.getElementById("undoBtn"), r=document.getElementById("redoBtn"); if(u){ u.disabled=!h.undo.length; r.disabled=!h.redo.length; } }
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{ record(); try{localStorage.setItem(DS_KEY,JSON.stringify(DS));}catch(e){} },250); }
const cur=()=>S.canvases[S.path[S.path.length-1]];
const CELL=24, R=1.1;
const placeable=c=>c.id!=="top";
const newId=p=>p+(++S.seq);
function findItem(id){ for(const c of Object.values(S.canvases)){ const it=c.items.find(i=>i.id===id); if(it) return {item:it,canvas:c}; } return null; }

/* ================= Geometry ================= */
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1,pal={},mode=null; // mode: null | "pick" | {link:fromId|null}
function readPal(){ const s=getComputedStyle(document.documentElement), k=cur().depth%2?"B":"A";
  for(const n of ["paper","minor","major","axis","ink"]) pal[n]=s.getPropertyValue(`--${k}-${n}`).trim();
  for(const n of ["node","ok","err","off","soft"]) pal[n]=s.getPropertyValue("--"+n).trim(); }
function resize(){ DPR=Math.min(devicePixelRatio||1,3); W=innerWidth; H=innerHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); draw(); }
const scale=()=>CELL*cur().view.zoom;
function toWorld(sx,sy){ const v=cur().view,s=scale(); return {x:v.x+(sx-W/2)/s,y:v.y+(sy-H/2)/s}; }
function toScreen(wx,wy){ const v=cur().view,s=scale(); return {x:(wx-v.x)*s+W/2,y:(wy-v.y)*s+H/2}; }
const isRect=t=>t==="matrix"||t==="note"||t==="registry";
function size(it){ return it.type==="matrix"?(it.shape==="circle"?{w:it.w||10,h:it.w||10}:{w:it.w||10,h:it.h||7}):it.type==="note"?{w:it.w||7,h:it.h||3.2}:it.type==="registry"?{w:it.w||6,h:it.h||4.5}:null; }
function hitItem(it,w){
  if(it.type==="file"){ const s=toScreen(w.x,w.y); return !!fileZone(it,s.x,s.y); }
  if(it.type==="matrix"&&it.shape==="circle"){ const rr=(it.w||10)/2, d=Math.hypot(w.x-it.x,w.y-it.y);
    return d<=rr && (d>rr-0.8 || w.y<it.y-rr+1.6); }
  if(isRect(it.type)){ const z=size(it), x0=it.x-z.w/2, y0=it.y-z.h/2;
    if(w.x<x0||w.x>x0+z.w||w.y<y0||w.y>y0+z.h) return false;
    return it.type!=="matrix" || w.y<y0+1.4 || w.x<x0+0.6 || w.x>x0+z.w-0.6 || w.y>y0+z.h-0.6;  // matrix: header strip or border
  }
  const r=it.type==="symbol"?0.95:R; return Math.hypot(it.x-w.x,it.y-w.y)<r*1.15;
}
function itemAt(sx,sy){ const w=toWorld(sx,sy), its=cur().items;
  for(let i=its.length-1;i>=0;i--) if(its[i].type!=="matrix" && hitItem(its[i],w)) return its[i];
  for(let i=its.length-1;i>=0;i--) if(its[i].type==="matrix" && hitItem(its[i],w)) return its[i];
  return null; }
function linkAt(sx,sy){ for(const L of cur().links){ const a=byId(L.from),b=byId(L.to); if(!a||!b) continue;
  const p=toScreen(a.x,a.y),q=toScreen(b.x,b.y),dx=q.x-p.x,dy=q.y-p.y,len=dx*dx+dy*dy||1;
  let t=((sx-p.x)*dx+(sy-p.y)*dy)/len; t=Math.max(0,Math.min(1,t));
  if(Math.hypot(sx-(p.x+t*dx),sy-(p.y+t*dy))<10) return L; } return null; }
const byId=id=>cur().items.find(i=>i.id===id);
function inside(m,it){ if(it===m) return false; const z=size(m);
  if(m.shape==="circle") return Math.hypot(it.x-m.x,it.y-m.y)<z.w/2;
  return Math.abs(it.x-m.x)<z.w/2 && Math.abs(it.y-m.y)<z.h/2; }
function handlePos(m){ const z=size(m); return m.shape==="circle"?{x:m.x+z.w/2*Math.SQRT1_2,y:m.y+z.w/2*Math.SQRT1_2}:{x:m.x+z.w/2,y:m.y+z.h/2}; }
function handleAt(sx,sy){ const w=toWorld(sx,sy), tol=Math.max(0.9,14/scale());
  for(const m of [...cur().items].reverse()) if(m.type==="matrix"&&!m.locked){ const p=handlePos(m); if(Math.abs(w.x-p.x)<tol&&Math.abs(w.y-p.y)<tol) return m; } return null; }
function overlaps(a,b){ const A=size(a),B=size(b);
  if(a.shape==="circle"&&b.shape==="circle") return Math.hypot(a.x-b.x,a.y-b.y)<A.w/2+B.w/2;
  if(a.shape==="circle"||b.shape==="circle"){ const c=a.shape==="circle"?a:b, q=c===a?b:a, Q=size(q), rr=size(c).w/2;
    const cx=Math.max(q.x-Q.w/2,Math.min(c.x,q.x+Q.w/2)), cy=Math.max(q.y-Q.h/2,Math.min(c.y,q.y+Q.h/2)); return Math.hypot(c.x-cx,c.y-cy)<rr; }
  return Math.abs(a.x-b.x)<(A.w+B.w)/2 && Math.abs(a.y-b.y)<(A.h+B.h)/2; }
function blockedBy(m,skip=[]){ return cur().items.find(o=>o!==m&&!skip.includes(o)&&o.type==="matrix"&&o.locked&&overlaps(m,o)); }
function linkState(L){ if(L.state) return L.state; const a=byId(L.from); if(a&&a.type==="gate"&&a.result) return a.result; return null; }

/* ================= Drawing ================= */
let OFF={x:0,y:0}, PREVIEW=false, TXT=1;   // TXT: text scale inside a preview window
function draw(){
  const v=cur().view,s=scale();
  ctx.setTransform(DPR,0,0,DPR,OFF.x*DPR,OFF.y*DPR); ctx.fillStyle=pal.paper; ctx.fillRect(0,0,W,H);
  let step=1; while(s*step<8) step*=5; const major=step*5, tl=toWorld(0,0), br=toWorld(W,H);
  const lines=(every,color)=>{ ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=1;
    for(let gx=Math.floor(tl.x/every)*every;gx<=br.x;gx+=every){ if(every!==major&&Math.abs(gx%major)<1e-9) continue; const px=Math.round((gx-v.x)*s+W/2)+.5; ctx.moveTo(px,0); ctx.lineTo(px,H); }
    for(let gy=Math.floor(tl.y/every)*every;gy<=br.y;gy+=every){ if(every!==major&&Math.abs(gy%major)<1e-9) continue; const py=Math.round((gy-v.y)*s+H/2)+.5; ctx.moveTo(0,py); ctx.lineTo(W,py); }
    ctx.stroke(); };
  lines(step,pal.minor); lines(major,pal.major);
  const o=toScreen(0,0); ctx.beginPath(); ctx.strokeStyle=pal.axis; ctx.moveTo(Math.round(o.x)+.5,0); ctx.lineTo(Math.round(o.x)+.5,H); ctx.moveTo(0,Math.round(o.y)+.5); ctx.lineTo(W,Math.round(o.y)+.5); ctx.stroke();

  const font=(px,w=500)=>`${w} ${px}px system-ui,-apple-system,sans-serif`, sF=s/TXT, fs=Math.min(14,Math.max(10,sF*0.55))*TXT, showText=sF>9 && fs>=4;
  const label=(t,x,y,base="top",col=pal.ink)=>{ if(!showText) return; ctx.fillStyle=col; ctx.font=font(fs); ctx.textAlign="center"; ctx.textBaseline=base; ctx.fillText(t,x,y); };
  const picking=mode==="pick"||(mode&&mode.link!==undefined);

  // matrices underneath
  for(const it of cur().items.filter(i=>i.type==="matrix")){
    const z=size(it), p=toScreen(it.x-z.w/2,it.y-z.h/2), w=z.w*s, h=z.h*s, col=picking?pal.ink:pal.node;
    ctx.strokeStyle=col; ctx.setLineDash(it.locked?[6,4]:[]);
    if(it.shape==="circle"){ const c=toScreen(it.x,it.y), rr=w/2;
      ctx.beginPath(); ctx.arc(c.x,c.y,rr,0,Math.PI*2); ctx.fillStyle=pal.paper; ctx.globalAlpha=.45; ctx.fill(); ctx.globalAlpha=1; ctx.lineWidth=1; ctx.stroke();
      ctx.lineWidth=picking?3.5:3; for(const a0 of [Math.PI*0.75,Math.PI*1.75]){ ctx.beginPath(); ctx.arc(c.x,c.y,rr,a0,a0+Math.PI*0.5); ctx.stroke(); }
    } else {
      ctx.fillStyle=pal.paper; ctx.globalAlpha=.45; ctx.fillRect(p.x,p.y,w,h); ctx.globalAlpha=1; ctx.lineWidth=1; ctx.strokeRect(p.x,p.y,w,h);
      const k=Math.min(w,h,s*2.2)*0.45; ctx.lineWidth=picking?3.5:3; ctx.beginPath();          // [ ] bracket corners
      ctx.moveTo(p.x+k,p.y); ctx.lineTo(p.x,p.y); ctx.lineTo(p.x,p.y+k); ctx.moveTo(p.x+w-k,p.y); ctx.lineTo(p.x+w,p.y); ctx.lineTo(p.x+w,p.y+k);
      ctx.moveTo(p.x,p.y+h-k); ctx.lineTo(p.x,p.y+h); ctx.lineTo(p.x+k,p.y+h); ctx.moveTo(p.x+w,p.y+h-k); ctx.lineTo(p.x+w,p.y+h); ctx.lineTo(p.x+w-k,p.y+h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x,p.y+1.4*s); ctx.lineTo(p.x+w,p.y+1.4*s); ctx.lineWidth=1; ctx.stroke(); }
    ctx.setLineDash([]);
    if(!it.locked){ const hp=toScreen(handlePos(it).x,handlePos(it).y); ctx.fillStyle=col; ctx.fillRect(hp.x-5,hp.y-5,10,10); }
    if(showText){ ctx.fillStyle=pal.ink; ctx.font=font(fs,600); ctx.textAlign="left"; ctx.textBaseline="middle"; { const tx=it.shape==="circle"?toScreen(it.x,it.y).x:p.x+8; ctx.textAlign=it.shape==="circle"?"center":"left";
        ctx.fillText((it.locked?"🔒 ":"")+(it.presents?"§ ":"")+it.name+((it.index||[]).length?`  ⧉${it.index.length}`:""), tx, p.y+(it.shape==="circle"?1.0:0.7)*s); ctx.textAlign="left"; }
      if(it.presents==="dsl"){ ctx.save(); ctx.beginPath(); ctx.rect(p.x,p.y+1.4*s,w,h-1.4*s); ctx.clip(); ctx.font=font(fs*0.9); ctx.textBaseline="top";
        S.dsl.forEach((d,i)=>{ const y=p.y+1.4*s+6+i*fs*1.45; ctx.fillStyle=pal.node; ctx.fillText(d.sym.length>18?d.sym.slice(0,17)+"…":d.sym,p.x+8,y);
          ctx.fillStyle=pal.soft; ctx.fillText(d.name+(d.pending?" (pending)":""),p.x+8+Math.min(w*0.42,150),y); }); ctx.restore(); } }
  }
  // links
  for(const L of cur().links){ const a=byId(L.from),b=byId(L.to); if(!a||!b) continue;
    const p=toScreen(a.x,a.y),q=toScreen(b.x,b.y), st=linkState(L);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.lineWidth=2; ctx.strokeStyle=st==="=T"?pal.ok:st==="=F"?pal.err:pal.axis; ctx.stroke();
    const ang=Math.atan2(q.y-p.y,q.x-p.x), mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    ctx.beginPath(); ctx.moveTo(mx+8*Math.cos(ang),my+8*Math.sin(ang)); ctx.lineTo(mx-6*Math.cos(ang-0.6),my-6*Math.sin(ang-0.6)); ctx.lineTo(mx-6*Math.cos(ang+0.6),my-6*Math.sin(ang+0.6)); ctx.closePath(); ctx.fillStyle=ctx.strokeStyle; ctx.fill();
    if(L.label) label(L.label,mx,my-8,"bottom",pal.soft);
  }
  // everything else
  for(const it of cur().items){ if(it.type==="matrix") continue;
    if(it.type==="file"){ drawFileWindow(it); continue; }
    const p=toScreen(it.x,it.y), r=R*s; if(p.x<-300||p.x>W+300||p.y<-300||p.y>H+300) continue;
    const sel=mode&&mode.link===it.id;
    ctx.lineWidth=picking?2.5:1.75; ctx.strokeStyle=sel?pal.ok:(picking?pal.ink:pal.node); ctx.fillStyle=pal.paper;
    if(it.type==="node"||it.type==="presence"){
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill(); if(it.type==="presence") ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
      if(it.type==="presence" && showText){ ctx.fillStyle=pal.node; ctx.font=font(r*0.9,600); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("§",p.x,p.y+1); }
      if(it.type==="node" && (it.logic||[]).length){ ctx.beginPath(); ctx.arc(p.x+r*.72,p.y-r*.72,Math.max(3,r*.18),0,Math.PI*2); ctx.fillStyle=pal.ok; ctx.fill(); }
      let name=it.name; if(it.type==="presence"){ const t=it.target&&findItem(it.target); name="§ "+(t?t.item.name:"(unlinked)"); }
      if(it.type==="node" && [...name].length<=2 && r>5){ ctx.fillStyle=pal.ink; ctx.font=`600 ${Math.max(8,r*1.05)}px ui-monospace,"SF Mono",Menlo,monospace,system-ui`; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(name,p.x,p.y+1); }
      else label(name,p.x,p.y+r+4);
    } else if(it.type==="gate"){
      ctx.beginPath(); ctx.moveTo(p.x,p.y-r*1.1); ctx.lineTo(p.x+r*1.1,p.y); ctx.lineTo(p.x,p.y+r*1.1); ctx.lineTo(p.x-r*1.1,p.y); ctx.closePath(); ctx.fill();
      if(it.result){ ctx.strokeStyle=it.result==="=T"?pal.ok:pal.err; } ctx.stroke();
      if(showText){ ctx.fillStyle=it.result==="=T"?pal.ok:it.result==="=F"?pal.err:pal.soft; ctx.font=font(fs,600); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(it.result||"?",p.x,p.y); }
      label(it.name,p.x,p.y+r*1.1+4);
    } else if(it.type==="symbol"){
      const h=0.95*s; ctx.beginPath(); ctx.roundRect?ctx.roundRect(p.x-h,p.y-h,2*h,2*h,6):ctx.rect(p.x-h,p.y-h,2*h,2*h); ctx.fill(); ctx.stroke();
      if(showText){ ctx.fillStyle=pal.ink; ctx.font=font(Math.min(22,h*0.9),600); ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(it.sym||"?",p.x,p.y+1); }
      label(it.name,p.x,p.y+h+4);
    } else { // note, registry
      const z=size(it), q=toScreen(it.x-z.w/2,it.y-z.h/2), w=z.w*s, h=z.h*s;
      ctx.fillRect(q.x,q.y,w,h); ctx.strokeRect(q.x,q.y,w,h);
      if(showText){ ctx.save(); ctx.beginPath(); ctx.rect(q.x,q.y,w,h); ctx.clip(); ctx.textAlign="left"; ctx.textBaseline="top";
        if(it.type==="registry"){ ctx.fillStyle=pal.ink; ctx.font=font(fs,600); ctx.fillText("☰ "+it.name,q.x+8,q.y+6);
          ctx.font=font(fs*0.9); ctx.fillStyle=pal.soft; (it.entries||[]).slice(0,Math.max(0,Math.floor((h-12)/(fs*1.5))-1)).forEach((e,i)=>ctx.fillText(`${e.key}  ${e.meaning}`,q.x+8,q.y+8+fs*1.5*(i+1)));

function buildOne(mp){

               ...mp.gates.map(([n,c])=>({type:"gate",name:n,condition:c,result:null}))];

}

}

    ...g("Vocabulary Homework","In Sandbox ECHO, set N and press ▶ N (or ⏭ 1). Each step is one phase of his homework: READ, SLOTS, LATERAL, VERTICAL, ANALOGICAL, TRANSCRIBE, FILTER, PRESENTIATE; eight steps learn one word, most general first (primes take four). A Current task window opens on his surface and shows the algorithm as he runs it: the phase row, the word, its slots, its strand, its classical chain, and the definitions it is presentiated into. If no canvas can open, he refuses to work. His results fill the Vocabulary Registry in ם, and in the Dictionary every occurrence of a learned word shows as §word: tap it to open its underside, its lateral, classical and analogical strands."),
    ...g("Dictionary","In Genesis Echo, ם/Registries holds the Dictionary: WordNet's definitions for 5,000 words, ordered from the most general (semantic primes and grammar terms) outward. Open it to look up a word, see its definitions, and see every word whose definitions use it. Sandbox ECHO reads the same dictionary as ECHO['dict']."),
    ...g("Symbol keys everywhere","Whenever you type in any text box in the Dev Suite, a strip of symbol keys sits above your phone's keyboard. Tap a key to insert it where you are typing; tap the keyboard's name to switch keyboards (★ Mine comes first once you have one); × hides the strip until the next box."),
    ...g("Keyboard Terminal","A Matrixed File with the canvas keyboard and the mind-map terminal on its surface. Open its window: the terminal grid has numbered lines and three modes (✎ Insert, ▣ Place, ⟋ Link); 12 keyboards and ★ Mine sit below it; % on the keyboard turns each key over to its logic card (its uses), % again turns the card over to examples you can tap to try and practise, and -% returns to the keys; drag any key onto any cell. ▾ folds the symbol keyboard into a one-row strip so the grid shows; Aa opens your phone's keyboard to type words straight into the grid, with the symbol strip above it. Brackets open as empty pairs; the audit checks each block as one structure, joined by the hinge rule; ◫ highlights frame (what % leaves unchanged) or operation (what % changes); ⇅ shows the dual display, linear above and compact below, both editable. It uses the Suite's own Python, so the audit and Unicode names work here. Its underside, through -% / %, is an ordinary canvas."),
    ...g("mini§ר§","A Matrixed File in the Dev Suite with three matrixed registries of single symbols on its surface: straight-lined (square brackets), curved (a circle), and hybrid. Each symbol is a node: tap it for its Unicode code point, name, category and classical logics; press % and tap it to open its own canvas, where its classical logics radiate from it. Which group a symbol belongs to is a judgment about its usual printed shape; move any that you see differently."),
    ...g("Registries and formulas","In Genesis Echo, ם/Registries holds: the Algorithm list, the Hebrew Glyph Registry (≈ fields), the LHEA Glyph Registry (each letter as an operation, with the six folding rules), the Mashet Glyph Legend, Latin Root Words, Latin Prefixes, Latin Suffixes, משת Symbology (inert), the Grammar Registry, the Syntax Tree Registry, Formula Symbols & Operators, and the data tables. The Formula Matrix, which is a matrix rather than a registry, is in י: one sub-matrix per domain, one node per formula, starting with the core formula."),
    ...g("Sandbox ECHO","Inside Genesis Echo, the ECHO chip opens Sandbox ECHO: his skeleton running in this page. Talk to him; every exchange is observed. Mark replies =T or =F. Teach with: teach word: definition. Hebrew glyphs get through: a single glyph is read as its letter (ר → resh), a Hebrew word is read whole and letter by letter. ⏭ Step runs one real evolution cycle: it diagnoses gaps, shallow words and rejected replies, proposes fixes from your teaching, word stems and his own inward search, validates and governs them, applies what passes, and measures the change. ▶ Run repeats until nothing more can change. What he learns is saved with the notebook. The Py console reaches the same ECHO."),
    ...g("Genesis Echo","Genesis Echo is the skeleton from the GitHub branch, mapped. Its surface lists his entry points. Its underside holds a Skeleton matrix with every class and top-level function; % on a class shows its methods, % on a method draws its flow map from his source. In its Filing & storage, every glyph matrix but ר is locked until ר reads itself: open ר and tap the self-read. The algorithm list lives once and is present in both ס and ם; only a few are placed by hand, the rest await ECHO's own placement."),
    ...g("Python libraries","Start › Files › Open a Python library maps any module from Python's standard library (json, re, datetime, …) into a Matrixed File. Its surface holds an About note and a You need… registry read from its own docstrings. Flip it: the underside has a matrix with a node per function or class; step into a function with % to see its flow map, where if, for and except are gates and return is what it gives. Compiled functions have no readable source, so their maps stop at the signature."),
    ...g("File windows","A window is a live preview. ▾ collapses it, % flips it between surface and underside, ⤢ or a tap on its body opens it full screen. Drag its header to move it. Several windows make a gallery."),
    ...g("Start menu","On the surface, the ▭ in the upper-left is the Start menu: Files (in the Suite), Matrices, and Canvases, where a notebook's surface and underside are one entry."),
    ...g("Filing and storage","On the underside (DSLא) and every §Canvas, the ▭ opens Filing & storage. On the Suite's underside it also offers Strike, which saves the whole Suite as a Matrixed File, such as Demo. Filing & storage holds the boot's 27 lettered folders, each written glyph/word, such as ם/Registries. Assigned folders lead; inert ones carry the letter's traditional sense until given a role. Open a folder to Reopen, Delete, or move anything to another folder."),

      where:()=>DS.active?DS.files[DS.active].name:"Dev Suite",
      task_open:()=>taskOpen(),
      algorithms:()=>py.toPy((S.algs||[]).map(x=>({id:x.id,name:x.name,status:x.status,placed:algPlacedIn(x.id)}))),
      folders:()=>py.toPy(GLYPH_ORDER.map(g=>({glyph:g,word:S.folders[g].word,assigned:S.folders[g].assigned,filed:S.filed.filter(f=>f.folder===g).length}))),
      dsl:()=>py.toPy(S.dsl.map(d=>({sym:d.sym,name:d.name,meaning:d.meaning}))),
      view:()=>{ const v=cur().view; return py.toPy({x:v.x,y:-v.y,zoom:v.zoom}); },
      recenter:()=>{ Object.assign(cur().view,{x:0,y:0,zoom:1}); draw(); save(); }
    });
    pyVer=py.runPython("import sys; sys.version.split()[0]"); dot.className="dot ok"; updateStatus(); runBtn.disabled=false; window.devPy=py;
    log(`# Pyodide ${py.version}, Python ${pyVer}, loaded in ${((performance.now()-t0)/1000).toFixed(1)}s`); log("# Try: import grid; grid.path(); grid.items()");
  }catch(err){ dot.className="dot err"; stxt.textContent="Python failed to load"; log("Pyodide could not start: "+(err&&err.message||err)); }
})();
async function run(){ const src=code.value; if(!src.trim()||!py) return; log(">>> "+src.replace(/\n/g,"\n... ")); runBtn.disabled=true;
  try{ const r=await py.runPythonAsync(src); if(r!==undefined&&r!==null) log(String(r)); }catch(e){ log(String(e.message||e).trim().split("\n").slice(-3).join("\n")); }
  runBtn.disabled=false; code.value=""; code.focus(); }
runBtn.onclick=run;
code.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!code.value.includes("\n")){ e.preventDefault(); run(); }});
</script>
</body>
</html>
