<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070b"><link rel="manifest" href="./manifest.webmanifest"><title>EVE Control Room</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131b;font-family:system-ui,sans-serif}#scene{position:absolute;inset:0;touch-action:none}#hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border:1px solid #287c9d;border-radius:20px;background:#031018cc;color:#91eaff;font-size:11px;white-space:nowrap;pointer-events:none}#consoleUI{display:none;position:absolute;inset:0;background:#02080df2;color:#9feaff;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));overflow:auto}.back{min-height:44px;border:1px solid #287c9d;border-radius:10px;background:#09212d;color:#9feaff;padding:0 14px}.preview{height:31%;min-height:150px;margin:10px 0;border:1px solid #287c9d;border-radius:12px;background:white;color:#526b76;display:flex;align-items:center;justify-content:center;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pad{min-height:70px;border:1px solid #287c9d;border-radius:10px;background:#09212d;color:#9feaff;font-weight:700}.small{font-size:10px;letter-spacing:.12em;color:#58b8d7}#avatar{position:absolute;right:16px;bottom:92px;color:#baffd7;text-align:center;text-shadow:0 0 8px #5cff9a;pointer-events:none}.alienHead{font-size:28px;line-height:22px}.alienBody{font:20px/18px monospace}#dpad{position:absolute;left:16px;bottom:20px;width:132px;height:132px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px}#dpad button{border:1px solid #66d7ff;background:#0b2c3dcc;color:#b9efff;border-radius:9px;font-size:20px;touch-action:none}#dpad button[data-move=f]{grid-column:2;grid-row:1}#dpad button[data-move=l]{grid-column:1;grid-row:2}#dpad button[data-move=b]{grid-column:2;grid-row:3}#dpad button[data-move=r]{grid-column:3;grid-row:2}#navHelp{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);border:1px solid #74ddff;border-radius:12px;background:#062334dd;color:#c6f5ff;padding:9px 13px;text-align:center;font-size:11px;letter-spacing:.08em;pointer-events:none;animation:pulse 1.7s infinite}@keyframes pulse{50%{opacity:.5}}#navHelp small{font-size:8px}</style></head><body><canvas id="scene"></canvas><div id="hint">Tap here: drag to look · D-pad to walk · tap console to approach</div>
<div id="avatar" aria-label="alien avatar"><div class="alienHead">●</div><div class="alienBody">╱│╲<br>╱ ╲</div></div>
<div id="dpad" aria-label="movement controls"><button data-move="f">▲</button><button data-move="l">◀</button><button data-move="b">▼</button><button data-move="r">▶</button></div>
<div id="navHelp">TAP HERE<br><small>CONSOLE</small></div><section id="consoleUI"><button class="back" id="back">← RETURN TO CONTROL ROOM</button><div class="preview"><div><b>ENVIRONMENT PREVIEW</b><br><span class="small">VOID · NO ENVIRONMENT SELECTED</span></div></div><div class="grid"><button class="pad">MATRIX</button><button class="pad">NVE</button><button class="pad">ALGORITHMS</button><button class="pad">ENVIRONMENTS</button><button class="pad">TESTING</button><button class="pad">STATE</button><button class="pad">GLYPHS</button><button class="pad">TOOLS</button></div><p class="small">GOVERNOR: ABSENT</p></section><script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const canvas=document.querySelector("#scene"),ui=document.querySelector("#consoleUI"),hint=document.querySelector("#hint"),dpad=document.querySelector("#dpad"),avatar=document.querySelector("#avatar"),navHelp=document.querySelector("#navHelp");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07131b);scene.fog=new THREE.Fog(0x07131b,18,42);
const camera=new THREE.PerspectiveCamera(65,1,.1,100);camera.position.set(0,2.2,7.5);
scene.add(new THREE.HemisphereLight(0xb9eeff,0x24313a,3.2));const key=new THREE.PointLight(0xb8efff,70,30);key.position.set(0,5,2);scene.add(key);
const metal=new THREE.MeshStandardMaterial({color:0x17242b,metalness:.75,roughness:.34});const dark=new THREE.MeshStandardMaterial({color:0x071016,metalness:.65,roughness:.4});const glow=new THREE.MeshStandardMaterial({color:0x0b5672,emissive:0x0b789e,emissiveIntensity:2});
function box(n,p,s,m=metal){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.name=n;o.position.set(...p);scene.add(o);return o}
box("floor",[0,-.1,0],[13,.2,18],dark);box("ceiling",[0,6,0],[13,.2,18],dark);box("rear",[0,3,7.5],[13,6,.25],metal);
const wallMat=new THREE.MeshStandardMaterial({color:0x203640,metalness:.55,roughness:.45,side:THREE.BackSide});
const roomWall=new THREE.Mesh(new THREE.CylinderGeometry(8.2,8.2,6.2,40,1,true),wallMat);roomWall.position.y=3;scene.add(roomWall);
const ceilingDisc=new THREE.Mesh(new THREE.CylinderGeometry(8.2,8.2,.18,40),metal);ceilingDisc.position.y=6.05;scene.add(ceilingDisc);
for(let i=0;i<12;i++){const ang=i*Math.PI/6;const lamp=new THREE.PointLight(0x8de8ff,10,8);lamp.position.set(Math.sin(ang)*6.6,4.8,Math.cos(ang)*6.6);scene.add(lamp)}
for(const x of[-4.8,-3.2,3.2,4.8])box("rib",[x,3,-2],[.18,5.7,.35],glow);
const stars=new THREE.BufferGeometry(),pts=[];for(let i=0;i<500;i++)pts.push((Math.random()-.5)*50,Math.random()*22-3,-8-Math.random()*30);stars.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xbdefff,size:.045})));
box("console",[0,1.05,-1.5],[5.6,1.65,2.1],metal).rotation.x=-.16;const screen=box("consoleScreen",[0,1.68,-.82],[4.75,.08,1.18],glow);screen.rotation.x=-.16;
box("preview",[0,3.75,-4.2],[5.9,2.25,.18],dark);box("previewGlow",[0,3.75,-4.08],[5.25,1.7,.05],new THREE.MeshBasicMaterial({color:0xeaf9ff}));
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.18,.16,20,60),glow);ring.position.set(4.2,1.7,-3.4);ring.rotation.y=.15;scene.add(ring);
const inner=new THREE.Mesh(new THREE.CircleGeometry(1.03,48),new THREE.MeshBasicMaterial({color:0x063044,transparent:true,opacity:.72,side:THREE.DoubleSide}));inner.position.copy(ring.position);inner.position.z+=.03;inner.rotation.y=.15;scene.add(inner);
for(const x of[-4.7,4.7]){box("sideConsole",[x,.75,-.7],[1.8,1.1,2.5],metal)}
let yaw=0,pitch=-.03,fov=65,drag=false,px=0,py=0,moved=0,pinch=0;
function orient(){camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;camera.fov=fov;camera.updateProjectionMatrix()}
canvas.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;moved=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.005;pitch=Math.max(-.65,Math.min(.55,pitch-dy*.004));px=e.clientX;py=e.clientY;orient()});
canvas.addEventListener("pointerup",e=>{drag=false;if(moved<12){const r=new THREE.Raycaster(),v=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);r.setFromCamera(v,camera);if(r.intersectObject(screen).length){ui.style.display="block";canvas.style.display="none";hint.style.display="none";dpad.style.display="none";avatar.style.display="none";navHelp.style.display="none"}}});
canvas.addEventListener("wheel",e=>{fov=Math.max(35,Math.min(80,fov+e.deltaY*.03));orient()},{passive:true});
canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)fov=Math.max(35,Math.min(80,fov-(d-pinch)*.08));pinch=d;orient()}},{passive:true});canvas.addEventListener("touchend",()=>pinch=0);
document.querySelector("#back").onclick=()=>{ui.style.display="none";canvas.style.display="block";hint.style.display="block";dpad.style.display="grid";avatar.style.display="block";navHelp.style.display="block"};
const move=(dir)=>{const step=.42;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));const right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));if(dir==="f")camera.position.addScaledVector(forward,step);if(dir==="b")camera.position.addScaledVector(forward,-step);if(dir==="l")camera.position.addScaledVector(right,-step);if(dir==="r")camera.position.addScaledVector(right,step);const rad=Math.hypot(camera.position.x,camera.position.z);if(rad>7.2){camera.position.x*=7.2/rad;camera.position.z*=7.2/rad}};
dpad.querySelectorAll("button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault();move(b.dataset.move)}));
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener("resize",resize);resize();orient();
(function loop(t){ring.rotation.z=t*.00025;renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script><script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script><script src="./eve/bootstrap.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script></body></html>
