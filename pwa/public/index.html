<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#02070b"><link rel="manifest" href="./manifest.webmanifest"><title>EVE Control Room</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;font-family:system-ui,sans-serif}#scene{position:absolute;inset:0;touch-action:none}#hint{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 11px;border:1px solid #287c9d;border-radius:20px;background:#031018cc;color:#91eaff;font-size:11px;white-space:nowrap;pointer-events:none}#consoleUI{display:none;position:absolute;inset:0;background:#02080df2;color:#9feaff;padding:max(14px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));overflow:auto}.back{min-height:44px;border:1px solid #287c9d;border-radius:10px;background:#09212d;color:#9feaff;padding:0 14px}.preview{height:31%;min-height:150px;margin:10px 0;border:1px solid #287c9d;border-radius:12px;background:white;color:#526b76;display:flex;align-items:center;justify-content:center;text-align:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.pad{min-height:70px;border:1px solid #287c9d;border-radius:10px;background:#09212d;color:#9feaff;font-weight:700}.small{font-size:10px;letter-spacing:.12em;color:#58b8d7}</style></head><body><canvas id="scene"></canvas><div id="hint">Drag to look · pinch to zoom · tap console to approach</div><section id="consoleUI"><button class="back" id="back">← RETURN TO CONTROL ROOM</button><div class="preview"><div><b>ENVIRONMENT PREVIEW</b><br><span class="small">VOID · NO ENVIRONMENT SELECTED</span></div></div><div class="grid"><button class="pad">MATRIX</button><button class="pad">NVE</button><button class="pad">ALGORITHMS</button><button class="pad">ENVIRONMENTS</button><button class="pad">TESTING</button><button class="pad">STATE</button><button class="pad">GLYPHS</button><button class="pad">TOOLS</button></div><p class="small">GOVERNOR: ABSENT</p></section><script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const canvas=document.querySelector("#scene"),ui=document.querySelector("#consoleUI"),hint=document.querySelector("#hint");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x01060a);scene.fog=new THREE.Fog(0x01060a,12,34);
const camera=new THREE.PerspectiveCamera(65,1,.1,100);camera.position.set(0,2.2,7.5);
scene.add(new THREE.HemisphereLight(0x5bcfff,0x081018,1.4));const key=new THREE.PointLight(0x36cfff,28,22);key.position.set(0,5,2);scene.add(key);
const metal=new THREE.MeshStandardMaterial({color:0x17242b,metalness:.75,roughness:.34});const dark=new THREE.MeshStandardMaterial({color:0x071016,metalness:.65,roughness:.4});const glow=new THREE.MeshStandardMaterial({color:0x0b5672,emissive:0x0b789e,emissiveIntensity:2});
function box(n,p,s,m=metal){const o=new THREE.Mesh(new THREE.BoxGeometry(...s),m);o.name=n;o.position.set(...p);scene.add(o);return o}
box("floor",[0,-.1,0],[13,.2,18],dark);box("ceiling",[0,6,0],[13,.2,18],dark);box("left",[-6.4,3,0],[.25,6,18],metal);box("right",[6.4,3,0],[.25,6,18],metal);box("rear",[0,3,7.5],[13,6,.25],metal);
for(const x of[-4.8,-3.2,3.2,4.8])box("rib",[x,3,-2],[.18,5.7,.35],glow);
const stars=new THREE.BufferGeometry(),pts=[];for(let i=0;i<500;i++)pts.push((Math.random()-.5)*50,Math.random()*22-3,-8-Math.random()*30);stars.setAttribute("position",new THREE.Float32BufferAttribute(pts,3));scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xbdefff,size:.045})));
box("console",[0,1.05,-1.5],[5.6,1.65,2.1],metal).rotation.x=-.16;const screen=box("consoleScreen",[0,1.68,-.82],[4.75,.08,1.18],glow);screen.rotation.x=-.16;
box("preview",[0,3.75,-4.2],[5.9,2.25,.18],dark);box("previewGlow",[0,3.75,-4.08],[5.25,1.7,.05],new THREE.MeshBasicMaterial({color:0xeaf9ff}));
const ring=new THREE.Mesh(new THREE.TorusGeometry(1.18,.16,20,60),glow);ring.position.set(4.2,1.7,-3.4);ring.rotation.y=.15;scene.add(ring);
const inner=new THREE.Mesh(new THREE.CircleGeometry(1.03,48),new THREE.MeshBasicMaterial({color:0x063044,transparent:true,opacity:.72,side:THREE.DoubleSide}));inner.position.copy(ring.position);inner.position.z+=.03;inner.rotation.y=.15;scene.add(inner);
for(const x of[-4.7,4.7]){box("sideConsole",[x,.75,-.7],[1.8,1.1,2.5],metal)}
let yaw=0,pitch=-.03,fov=65,drag=false,px=0,py=0,moved=0,pinch=0;
function orient(){camera.rotation.order="YXZ";camera.rotation.y=yaw;camera.rotation.x=pitch;camera.fov=fov;camera.updateProjectionMatrix()}
canvas.addEventListener("pointerdown",e=>{drag=true;px=e.clientX;py=e.clientY;moved=0;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-px,dy=e.clientY-py;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*.005;pitch=Math.max(-.65,Math.min(.55,pitch-dy*.004));px=e.clientX;py=e.clientY;orient()});
canvas.addEventListener("pointerup",e=>{drag=false;if(moved<12){const r=new THREE.Raycaster(),v=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);r.setFromCamera(v,camera);if(r.intersectObject(screen).length){ui.style.display="block";canvas.style.display="none";hint.style.display="none"}}});
canvas.addEventListener("wheel",e=>{fov=Math.max(35,Math.min(80,fov+e.deltaY*.03));orient()},{passive:true});
canvas.addEventListener("touchmove",e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)fov=Math.max(35,Math.min(80,fov-(d-pinch)*.08));pinch=d;orient()}},{passive:true});canvas.addEventListener("touchend",()=>pinch=0);
document.querySelector("#back").onclick=()=>{ui.style.display="none";canvas.style.display="block";hint.style.display="block"};
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener("resize",resize);resize();orient();
(function loop(t){ring.rotation.z=t*.00025;renderer.render(scene,camera);requestAnimationFrame(loop)})();
</script><script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script><script src="./eve/bootstrap.js"></script><script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));</script></body></html>
