<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.webmanifest">
<title>Chat Archive Workbench</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="grid" aria-hidden="true"></canvas>
<main id="desktop">
  <section class="window">
    <header><strong>Archive Workbench</strong><span id="pyStatus">Pyodide: loading…</span></header>
    <div class="toolbar">
      <label class="button">Open ZIP<input id="zipInput" type="file" accept=".zip,application/zip" hidden></label>
      <button id="chooseDir">Choose workspace</button><button id="clearLog">Clear log</button>
    </div>
    <div id="drop">Drop a ChatGPT export ZIP here</div>
    <progress id="progress" max="100" value="0"></progress>
    <pre id="log">Ready. Files stay on this device unless you explicitly export them.</pre>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script type="module" src="app.js"></script>
</body></html>
