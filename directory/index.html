<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF2; --panel:#FFFFFF; --ink:#18202B; --muted:#5B6573; --line:#D3D8DF; --accent:#2B5FD9;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#15191F; --panel:#1C2129; --ink:#E6EAF0; --muted:#98A2B0; --line:#2D343E; --accent:#7FA2FF; }
}
:root[data-theme="dark"]{ --bg:#15191F; --panel:#1C2129; --ink:#E6EAF0; --muted:#98A2B0; --line:#2D343E; --accent:#7FA2FF; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 var(--sans)}
main{max-width:640px; margin:0 auto; padding:32px 18px}
h1{font-size:22px; font-weight:600; margin:0 0 4px}
p{color:var(--muted); margin:0 0 24px; font-size:15px}
ol{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:grid; grid-template-columns:3.2em 1fr; gap:0 12px; padding:14px 4px; text-decoration:none; color:inherit}
li a:hover .nm, li a:focus-visible .nm{color:var(--accent); text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.g{font-family:var(--mono); color:var(--accent); grid-row:span 2; align-self:center}
.nm{font-weight:500}
.ds{color:var(--muted); font-size:14px}
</style>
</head>
<body>
<main>
  <h1>Directory</h1>
  <p>Every environment, each standing alone. Listed in the order the data flows.</p>
  <ol id="envs"></ol>
</main>
<script>
"use strict";
const ENVIRONMENTS = [
  { name: "Datasets", mark: "[ ]", url: "/datasets/", desc: "Raw data, stored unaltered, with provenance." }
];
const ol = document.getElementById("envs");
for (const e of ENVIRONMENTS){
  const li = document.createElement("li"), a = document.createElement("a");
  a.href = e.url;
  a.innerHTML = `<span class="g" aria-hidden="true"></span><span class="nm"></span><span class="ds"></span>`;
  a.querySelector(".g").textContent = e.mark; a.querySelector(".nm").textContent = e.name; a.querySelector(".ds").textContent = e.desc;
  li.appendChild(a); ol.appendChild(li);
}
</script>
</body>
</html>
