<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos & Infographics — Personal Library</title><style>body{font:15px system-ui;margin:0;background:#f1f3f7;color:#192331}header{padding:12px 16px;background:white;border-bottom:1px solid #d9dee8}h1{font-size:20px;margin:0 0 6px}.note{font-size:12px;color:#536070}main{padding:14px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{background:#2448ad;color:white;border-radius:8px;padding:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}label input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}label:focus-within{outline:3px solid #f1b928}input[type=file]{max-width:100%}button{border:1px solid #b8c2d0;border-radius:8px;padding:8px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px}.card{background:white;border:1px solid #d9dee8;border-radius:10px;padding:9px}.card img{width:100%;height:220px;object-fit:contain;background:#f6f7fa}.card input{width:100%;box-sizing:border-box}.card small{color:#536070;display:block;overflow-wrap:anywhere}</style></head><body><header><h1>Photos & Infographics</h1><div class="note">Your personal registry. Stored in this browser using IndexedDB; nothing is uploaded to GitHub or a server. Back up your originals.</div></header><main><div class="toolbar"><label>📁 Upload photos <input id="files" type="file" accept="image/*" multiple></label><label>📷 Take photo <input id="camera" type="file" accept="image/*" capture="environment"></label><button id="backup">Back up photos + captions</button><button id="restore">Restore backup</button><input id="restore-file" type="file" accept="application/json" hidden><button id="export">Export registry metadata</button><span id="status" aria-live="polite"></span></div><div id="grid" class="grid"></div></main><script>
const DB='lexicon-personal-photos-v1',STORE='images';let db;
const request=indexedDB.open(DB,1);request.onupgradeneeded=()=>request.result.createObjectStore(STORE,{keyPath:'id'});request.onerror=()=>document.getElementById('status').textContent='Storage unavailable';request.onsuccess=()=>{db=request.result;render()};
function all(){return new Promise((resolve,reject)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
function save(row){return new Promise((resolve,reject)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(row);q.onsuccess=resolve;q.onerror=()=>reject(q.error)})}
function remove(id){return new Promise((resolve,reject)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).delete(id);q.onsuccess=resolve;q.onerror=()=>reject(q.error)})}
async function digest(blob){const bytes=await blob.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}
async function importPhotos(e){if(!db)return;let n=0;for(const f of e.target.files){if(!f.type.startsWith('image/'))continue;const id=await digest(f);await save({id,name:f.name,blob:f,caption:f.name,source:'User-imported photo',added:new Date().toISOString()});n++}document.getElementById('status').textContent=n+' image(s) imported; exact duplicates merged';e.target.value='';await render()};
document.getElementById('files').onchange=importPhotos;document.getElementById('camera').onchange=importPhotos;
async function render(){if(!db)return;const rows=await all(),grid=document.getElementById('grid');grid.replaceChildren();for(const r of rows){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.alt=r.caption;const url=URL.createObjectURL(r.blob);img.src=url;img.onload=()=>URL.revokeObjectURL(url);const caption=document.createElement('input');caption.value=r.caption;caption.setAttribute('aria-label','Caption');caption.onchange=async()=>{r.caption=caption.value;await save(r)};const small=document.createElement('small');small.textContent=r.name+' · SHA-256 '+r.id.slice(0,16)+'…';const del=document.createElement('button');del.textContent='Remove';del.onclick=async()=>{if(confirm('Remove this photo from this browser?')){await remove(r.id);await render()}};card.append(img,caption,small,del);grid.append(card)}if(!rows.length)grid.textContent='No photos imported yet. Select the supplied page photographs to add one copy of each.'}
function downloadJSON(obj,name){const u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
document.getElementById('backup').onclick=async()=>{const rows=await all();const result=[];for(const {blob,...row} of rows){const b=await blob.arrayBuffer();const bytes=new Uint8Array(b);let s='';for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));result.push({...row,mime:blob.type,data: btoa(s)})}downloadJSON({format:'lexicon-photo-backup-v1',photos:result},'lexicon-photos-backup.json');document.getElementById('status').textContent='Backup prepared. Save it somewhere safe.'};
document.getElementById('restore').onclick=()=>document.getElementById('restore-file').click();
document.getElementById('restore-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const j=JSON.parse(await f.text());if(j.format!=='lexicon-photo-backup-v1'||!Array.isArray(j.photos))throw Error('Unrecognized backup format');let n=0;for(const {data,mime,...row} of j.photos){if(typeof data!=='string'||typeof row.id!=='string'||!/^image\//.test(mime||''))continue;const binary=atob(data);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);const blob=new Blob([bytes],{type:mime});if(await digest(blob)!==row.id)throw Error('Image checksum mismatch');await save({...row,blob});n++}await render();document.getElementById('status').textContent=n+' photos restored'}catch(err){document.getElementById('status').textContent='Restore failed: '+err.message}e.target.value=''};
document.getElementById('export').onclick=async()=>{const rows=(await all()).map(({blob,...rest})=>rest);const u=URL.createObjectURL(new Blob([JSON.stringify(rows,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='lexicon-photo-registry.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
</script></body></html>
