name: Autonomous Proposition Construction 009
on:
  push:
    branches: [autonomous-agency]
    paths:
      - "experiments/autonomous_proposition_construction_009.py"
      - ".github/workflows/autonomous-proposition-009.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/autonomous_proposition_construction_009.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/autonomous_proposition_construction_009.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: autonomous proposition construction 009"
          git push origin HEAD:autonomous-agency
