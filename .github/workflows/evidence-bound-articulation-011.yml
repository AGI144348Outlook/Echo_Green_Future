name: Evidence Bound Articulation 011
on:
  push:
    branches: [autonomous-agency]
    paths:
      - "experiments/evidence_bound_articulation_011.py"
      - ".github/workflows/evidence-bound-articulation-011.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python experiments/evidence_bound_articulation_011.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/evidence_bound_articulation_011.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: evidence-bound articulation trial 011"
          git push origin HEAD:autonomous-agency
