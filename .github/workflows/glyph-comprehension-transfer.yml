name: Glyph Comprehension Transfer Audit

on:
  push:
    branches: [autonomous-agency]
    paths:
      - "experiments/glyph_comprehension_transfer_007.py"
      - ".github/workflows/glyph-comprehension-transfer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run frozen-lobby transfer audit
        run: python experiments/glyph_comprehension_transfer_007.py
      - name: Commit Trial 007 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/glyph_comprehension_transfer_007.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: glyph comprehension transfer 007"
          git push origin HEAD:autonomous-agency
