name: Autonomous Agency Bundle Import

on:
  workflow_dispatch:
  push:
    branches: [autonomous-agency]
    paths:
      - ".github/workflows/autonomous-agency-import-test.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
          fetch-depth: 0

      - name: Unpack bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/echo-aa
          mkdir -p /tmp/echo-aa
          unzip -q ECHO_Autonomous_Agency_Commit2.zip -d /tmp/echo-aa
          cp -a /tmp/echo-aa/ECHO_AutonomousAgency ./

      - name: Commit bundle exactly as supplied
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ECHO_AutonomousAgency
          git commit -m "feat: A-168 RecessAgent, A-173 QuestionFormulationEngine, 22 glyph registry docs, continuum suite A-169–A-172, updated algorithm matrix (65 algorithms)"
          git push origin HEAD:autonomous-agency
