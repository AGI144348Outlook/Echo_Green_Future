name: Swadesh Glyph Dictionary Classroom

on:
  push:
    branches: [autonomous-agency]
    paths:
      - "experiments/swadesh_glyph_dictionary_classroom_006.py"
      - ".github/workflows/swadesh-glyph-dictionary-classroom.yml"
      - "sandbox/echo_sandbox_swadesh.json"
      - "ECHO_GlyphRegistry/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q nltk
      - name: Run Trial 006
        run: python experiments/swadesh_glyph_dictionary_classroom_006.py
      - name: Commit Trial 006 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/swadesh_glyph_dictionary_classroom_006.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: Swadesh glyph dictionary classroom 006"
          git push origin HEAD:autonomous-agency
