name: Resh Lattice Agency Experiment

on:
  push:
    branches:
      - resh-lattice-agency
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-agency-test:
    if: github.ref == 'refs/heads/resh-lattice-agency'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: resh-lattice-agency

      - name: Establish protected-branch boundary
        run: |
          test "$GITHUB_REF_NAME" = "resh-lattice-agency"
          echo "Experiment branch: $GITHUB_REF_NAME"
          echo "main, genesis-documentary, autonomous-agency: read-only / untouched"

      - name: Expose unfamiliar environment
        run: |
          rm -rf agency_workspace
          mkdir agency_workspace
          unzip -q "lattice-workbench-repo (1).zip" -d agency_workspace
          echo "=== WORKBENCH INVENTORY ==="
          find agency_workspace -maxdepth 3 -type f | sort | head -200

      - name: Run untouched workbench probes
        id: probe
        continue-on-error: true
        run: |
          set +e
          {
            echo "# Resh Lattice Agency Observation Log"
            echo
            echo "Objective: determine whether the supplied Lattice Workbench can be used or developed by ECHO."
            echo
            echo "## Initial inventory"
            find agency_workspace -maxdepth 3 -type f | sort | head -200
            echo
            echo "## Candidate Python entry points"
            find agency_workspace -type f -name '*.py' | sort
            echo
            echo "## Execution observations"
            while IFS= read -r f; do
              echo
              echo "### PROBE: $f"
              timeout 30s python "$f" 2>&1
              echo "EXIT_CODE=$?"
            done < <(find agency_workspace -type f \( -name 'lattice_workbench.py' -o -name 'main.py' -o -name 'run.py' \) | sort)
          } | tee agency_observation.md
          exit 0

      - name: Run bounded Resh closed loop\n        continue-on-error: true\n        run: |\n          echo "=== RUN #5: RESH CLOSED LOOP ===" | tee -a agency_observation.md\n          RESH_WORKSPACE="$PWD/agency_workspace/repo" RESH_AGENCY_LOG="$PWD/agency_run5.md" timeout 240s python experiments/resh_lattice_agency_runner.py 2>&1 | tee -a agency_observation.md\n          echo "RESH_LOOP_EXIT=${PIPESTATUS[0]}" | tee -a agency_observation.md\n\n      - name: Prepare portable ECHO corpus
        run: |
          python -m pip install -q nltk
          python src/build_thesaurus.py 2>&1 | tee -a agency_observation.md

      - name: Let existing ECHO mechanisms inspect the observation
        continue-on-error: true
        run: |
          echo "=== ECHO SELF-GOVERNANCE PROBE ===" | tee -a agency_observation.md
          ECHO_THESAURUS="$PWD/en_thesaurus.jsonl" ECHO_BDB="$PWD/agency_workspace/repo/data/raw/DictBDB.json" PYTHONPATH="$PWD/src:$PYTHONPATH" timeout 180s python tests/self_governance_test.py 2>&1 | tee -a agency_observation.md
          echo "SELF_GOV_EXIT=${PIPESTATUS[0]}" | tee -a agency_observation.md

      - name: Preserve evidence
        uses: actions/upload-artifact@v4
        with:
          name: resh-lattice-agency-observation
          path: |\n            agency_observation.md\n            agency_run5.md
