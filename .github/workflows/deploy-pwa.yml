name: Deploy PWA to Cloudflare Workers

on:
  push:
    branches:
      - pwa-hosting-environment
    paths:
      - "pwa/**"
      - ".github/workflows/deploy-pwa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy PWA
    steps:
      - uses: actions/checkout@v4

      - name: Build clean deployment bundle
        run: |
          rm -rf deploy-pwa wrangler-tooling
          mkdir -p deploy-pwa wrangler-tooling
          cp pwa/index.html deploy-pwa/
          cp pwa/manifest.webmanifest deploy-pwa/
          cp pwa/sw.js deploy-pwa/
          cp -R pwa/css deploy-pwa/css
          cp -R pwa/js deploy-pwa/js
          cp -R pwa/echo deploy-pwa/echo
          cp -R pwa/icons deploy-pwa/icons

      - name: Install Wrangler outside asset directory
        working-directory: wrangler-tooling
        run: |
          npm init -y
          npm install wrangler@4

      - name: Deploy clean PWA assets
        working-directory: wrangler-tooling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy \
            --name echo-pwa-hosting-environment \
            --compatibility-date 2026-09-24 \
            --assets ../deploy-pwa
