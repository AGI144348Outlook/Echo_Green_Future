name: Trial 015 - Governed Notebook Manipulation
on:
  push:
    branches: [algebra]
    paths:
      - "tests/trial_015_governed_notebook.py"
      - "matrices/symbols/mashet_instruction_manual.json"
      - "matrices/symbols/algebra_mashet.json"
      - "matrices/glyphs/hebrew_glyph_registry.json"
      - ".github/workflows/trial-015-governed-notebook.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trial-015:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Trial 015
        run: python tests/trial_015_governed_notebook.py
      - name: Upload raw decision trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-015-trace
          path: artifacts/trial_015_trace.json
          if-no-files-found: error
