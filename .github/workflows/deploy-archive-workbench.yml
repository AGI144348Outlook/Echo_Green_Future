name: Deploy Chat Archive Workbench

on:
  push:
    branches:
      - chat-archive-pyodide-workbench
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy archive workbench
    steps:
      - uses: actions/checkout@v4
      - name: Deploy isolated static PWA to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.archive.toml
