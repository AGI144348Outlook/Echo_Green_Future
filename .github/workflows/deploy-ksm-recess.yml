name: Deploy KSM Recess PWA

on:
  push:
    branches: [ksm-recess-wholesale]
    paths:
      - "pwa/ksm-live.html"
      - "pwa/css/ksm-recess.css"
      - "pwa/js/ksm-live.js"
      - "experiments/e12_recess_log.json"
      - ".github/workflows/deploy-ksm-recess.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build KSM Recess PWA
        run: |
          rm -rf deploy-ksm wrangler-tooling
          mkdir -p deploy-ksm/css deploy-ksm/js wrangler-tooling
          cp pwa/ksm-live.html deploy-ksm/index.html
          cp pwa/css/ksm-recess.css deploy-ksm/css/ksm-live.css
          cp pwa/js/ksm-live.js deploy-ksm/js/\n          cp -R echo deploy-ksm/echo
          cp experiments/e12_recess_log.json deploy-ksm/
      - name: Install Wrangler
        working-directory: wrangler-tooling
        run: |
          npm init -y
          npm install wrangler@4
      - name: Deploy KSM Recess
        working-directory: wrangler-tooling
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --name echo-ksm-recess --compatibility-date 2026-09-24 --assets ../deploy-ksm
