name: ECHO-017 full WordNet unpaced 300-second reinforcement study
on:
  push:
    branches: [feature/autonomous-agency-card-evidence]
    paths:
      - "ECHO_AutonomousAgency/experiments/echo017_full_wordnet_study.py"
      - "ECHO_AutonomousAgency/experiments/test_echo017_full_wordnet_study.py"
      - "ECHO_AutonomousAgency/neon/echo017_full_wordnet_mcp_tools.json"
      - ".github/workflows/echo017-full-wordnet-300s.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-dictionary-study:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original full Princeton WordNet provider
        run: |
          python -m pip install 'nltk==3.9.2'
          python -m nltk.downloader -d "$RUNNER_TEMP/nltk_data" wordnet
      - name: Confirm pre-test publication and corpus scope
        run: |
          echo "PRE-TEST full-dictionary correction: https://github.com/AGI144348Outlook/Echo_Green_Future/issues/438#issuecomment-6834240544"
          git rev-parse HEAD
          NLTK_DATA="$RUNNER_TEMP/nltk_data" python - <<'PY'
          from nltk.corpus import wordnet as wn
          words=sum(1 for _ in wn.all_lemma_names())
          synsets=sum(1 for _ in wn.all_synsets())
          print(f"Full Princeton WordNet corpus: {words} lemma names, {synsets} synsets.")
          assert words > 100000 and synsets > 100000
          PY
      - name: Test full corpus and three-system discovery
        run: NLTK_DATA="$RUNNER_TEMP/nltk_data" python -m unittest discover -s ECHO_AutonomousAgency/experiments -p 'test_echo017_full_wordnet_study.py' -v
      - name: Run unpaced 300 seconds against full WordNet
        run: |
          NLTK_DATA="$RUNNER_TEMP/nltk_data" ECHO_STUDY_SECONDS=300 ECHO_STUDY_OUTDIR=echo017_full_wordnet_results python ECHO_AutonomousAgency/experiments/echo017_full_wordnet_study.py
      - name: Preserve all logged provisional evidence and results
        uses: actions/upload-artifact@v4
        with:
          name: echo017-full-wordnet-300s
          path: echo017_full_wordnet_results/
          retention-days: 30
