name: Echo A-000 Canvas Experiment Tests
on:
  push:
    branches: [experiment-echo-graphql-canvas-000]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned Genesis Documentary Governor
        run: |
          curl --fail --location --retry 3 --output echo_governor_skeleton.py https://raw.githubusercontent.com/AGI144348Outlook/Echo_Green_Future/f888091f6d81c60a61e5ca9bbba14d8d28a18093/src/echo_governor_skeleton.py
          python -m py_compile echo_governor_skeleton.py echo_canvas_bridge.py echo_neuroplasticity_overlay.py echo_ks_recess_adapter.py
      - name: Exercise real AlgorithmMatrix bridge
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_echo_canvas_bridge.py' -v
      - name: Test 002 overlay and KSM Recess adapter
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_integration_002.py' -v
      - name: Test 003 glyph card reindexing against actual AlgorithmMatrix
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_glyph_cards_003.py' -v
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check echo_canvas_experiment.js
      - name: Install headless Chromium test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run Pyodide browser end-to-end test
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/echo-http.log 2>&1 &
          node tests/browser_echo_canvas.cjs

      - name: Browser Test 007 Fractal LVT Canvas
        run: node tests/browser_fractal_lvt_007.cjs
      - name: Upload Canvas screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canvas-fractal-lvt-007
          path: canvas_browser_007.png
          if-no-files-found: ignore
