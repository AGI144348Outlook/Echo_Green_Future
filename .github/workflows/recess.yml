name: ECHO Recess

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recess.yml"

permissions:
  contents: write

jobs:
  recess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install nltk

      - run: python3 ECHO_AutonomousAgency/src/echo_school_day.py

      - run: |
          git config user.name "ECHO"
          git config user.email "echo@mashet.ai"
          git add ECHO_AutonomousAgency/sandbox/recess_session_log.json ECHO_AutonomousAgency/sandbox/school_day_log.json
          git diff --staged --quiet || git commit -m "recess: session log $(date -u +%Y-%m-%dT%H:%M)"
          git push

