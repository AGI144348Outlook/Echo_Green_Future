name: ECHO Cloudflare Bridge

on:
  push:
    branches:
      - bridge-experiment
    paths:
      - "bridge/operation.json"
      - ".github/workflows/cloudflare-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout bridge definition
        uses: actions/checkout@v4

      - name: Check bridge credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bridge executor is installed, but its GitHub Actions credentials are not configured yet."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Cloudflare credentials are present (values intentionally not displayed)."

      - name: Execute approved operation
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          operation="$(python -c 'import json; print(json.load(open("bridge/operation.json"))["operation"])')"

          case "$operation" in
            inventory_workers)
              response="$(curl --fail-with-body --silent --show-error \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H "Content-Type: application/json")"

              python -c '
          import json,sys
          data=json.loads(sys.stdin.read())
          print(json.dumps({
              "operation":"inventory_workers",
              "success":data.get("success"),
              "workers":[x.get("id") for x in (data.get("result") or [])]
          }, indent=2))
          ' <<< "$response"
              ;;
            deploy_worker)
              # Inert deployment only. Deployment requires an explicit workflow_dispatch run;
              # the push trigger never deploys a Worker.
              if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
                echo "Deployment requires manual workflow_dispatch authorization."
                exit 2
              fi
              python - <<'PY'
          import json
          data=json.load(open("bridge/operation.json"))
          assert set(data)=={"operation","worker_name"}, "Unexpected operation fields"
          assert data["worker_name"]=="echo-bot-stage0-inert", "Worker name not approved"
          PY
              worker_name="$(python -c 'import json;print(json.load(open("bridge/operation.json"))["worker_name"])')"
              test -f bridge/worker.mjs
              echo "Deploying approved inert Worker: $worker_name"
              curl --fail-with-body --silent --show-error \
                --request PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${worker_name}" \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header "Content-Type: application/javascript" \
                --header "X-Auth-Email:" \
                --data-binary @bridge/worker.mjs > /tmp/echo-worker-deploy-response.json
              python - <<'PY'
          import json
          data=json.load(open("/tmp/echo-worker-deploy-response.json"))
          if not data.get("success"):
              raise SystemExit("Cloudflare returned unsuccessful deployment")
          print("Inert Worker script uploaded successfully; no routes or cron configured.")
          PY
              ;;
            *)
              echo "Rejected operation: $operation"
              echo "Only explicitly implemented operations may execute."
              exit 2
              ;;
          esac
