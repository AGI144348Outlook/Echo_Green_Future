name: Swadesh Dictionary Classroom Gate

on:
  push:
    branches: [autonomous-agency]
    paths:
      - "experiments/swadesh_dictionary_classroom_gate_005.py"
      - ".github/workflows/swadesh-dictionary-classroom.yml"
      - "sandbox/echo_sandbox_swadesh.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: autonomous-agency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dictionary dependency
        run: pip install -q nltk
      - name: Run isolated dictionary-classroom oscillation
        run: python experiments/swadesh_dictionary_classroom_gate_005.py
      - name: Commit immutable trial results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/swadesh_dictionary_classroom_gate_005.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "results: Swadesh dictionary-classroom gate 005"
          git push origin HEAD:autonomous-agency
